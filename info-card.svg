<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 570" width="100%" height="100%">
  <defs>
    <style>
      @keyframes lineFadeIn {
        0% {
          opacity: 0;
          transform: translateX(-14px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .term-card {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.2;
        rx: 12px;
      }
      .term-topbar {
        fill: #161b22;
      }
      .term-heading {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
        font-size: 12px;
        fill: #8b949e;
        font-weight: 500;
      }
      .code-title {
        font-family: "SF Mono", "Fira Code", Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        fill: #58a6ff;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .code-sep {
        font-family: "SF Mono", "Fira Code", Menlo, monospace;
        font-size: 11px;
        fill: #30363d;
      }
      .code-label {
        font-family: "SF Mono", "Fira Code", Menlo, Monaco, Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
      }
      .term-line {
        opacity: 0;
        animation: lineFadeIn 0.35s ease-out forwards;
      }
      .term-palette {
        opacity: 0;
        animation: lineFadeIn 0.35s ease-out forwards;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="538" height="568" class="term-card" />

  <!-- Window Header -->
  <path d="M 1 13 Q 1 1 13 1 L 527 1 Q 539 1 539 13 L 539 36 L 1 36 Z" class="term-topbar" />
  <line x1="1" y1="36" x2="539" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="20" cy="19" r="5.5" fill="#ff5f56" />
  <circle cx="36" cy="19" r="5.5" fill="#ffbd2e" />
  <circle cx="52" cy="19" r="5.5" fill="#27c93f" />

  <!-- Terminal Window Title -->
  <text x="270.0" y="23" text-anchor="middle" class="term-heading">shloka@macbook-air: ~ (fastfetch)</text>

  <!-- Output Lines -->
  <g class="term-line" style="animation-delay: 0.08s;"><text x="32" y="72" class="code-title">shloka@mit-wpu</text></g><g class="term-line" style="animation-delay: 0.16s;"><text x="32" y="99" class="code-sep">─────────────────────────────────────────────────</text></g><g class="term-line" style="animation-delay: 0.24s;"><text x="32" y="126" class="code-label" fill="#bc8cff">OS: <tspan fill="#c9d1d9" font-weight="400">macOS Sonoma (Darwin arm64)</tspan></text></g><g class="term-line" style="animation-delay: 0.32s;"><text x="32" y="153" class="code-label" fill="#bc8cff">Host: <tspan fill="#c9d1d9" font-weight="400">MacBook Air (Apple Silicon)</tspan></text></g><g class="term-line" style="animation-delay: 0.4s;"><text x="32" y="180" class="code-label" fill="#3fb950">Role: <tspan fill="#f0f6fc" font-weight="400">Software Engineer · iOS Dev · AI &amp; Data Builder</tspan></text></g><g class="term-line" style="animation-delay: 0.48s;"><text x="32" y="207" class="code-label" fill="#e3b341">Education: <tspan fill="#c9d1d9" font-weight="400">B.Tech CSE @ MIT World Peace Univ (8.82 CGPA)</tspan></text></g><g class="term-line" style="animation-delay: 0.56s;"><text x="32" y="234" class="code-label" fill="#f0883e">🏆 Honors: <tspan fill="#58a6ff" font-weight="400">Apple Swift Challenge &#x27;26 Distinguished Top 50</tspan></text></g><g class="term-line" style="animation-delay: 0.64s;"><text x="32" y="261" class="code-label" fill="#f0883e">🏛️ Key Event: <tspan fill="#c9d1d9" font-weight="400">Invited to Apple Park, Cupertino · ZS Top 100</tspan></text></g><g class="term-line" style="animation-delay: 0.72s;"><text x="32" y="288" class="code-label" fill="#58a6ff">Experience: <tspan fill="#c9d1d9" font-weight="400">Omnevu Systems (App &amp; Risk) · Infosys (Retail)</tspan></text></g><g class="term-line" style="animation-delay: 0.8s;"><text x="32" y="315" class="code-label" fill="#3fb950">⚡ Big Data: <tspan fill="#7ee787" font-weight="400">Zomato AI Pipeline (33M+ rows, Snowflake, dbt)</tspan></text></g><g class="term-line" style="animation-delay: 0.88s;"><text x="32" y="342" class="code-label" fill="#3fb950">📊 Analytics: <tspan fill="#7ee787" font-weight="400">PharmaPulse (2.1k+ sales records, Tableau, SQL)</tspan></text></g><g class="term-line" style="animation-delay: 0.96s;"><text x="32" y="369" class="code-label" fill="#ff7b72">Stack: <tspan fill="#c9d1d9" font-weight="400">Python · Swift · Snowflake · dbt · Airflow · C++</tspan></text></g><g class="term-line" style="animation-delay: 1.04s;"><text x="32" y="396" class="code-label" fill="#ff7b72">Tools: <tspan fill="#c9d1d9" font-weight="400">Figma · Adobe Suite · Jira · Git · Docker · Linux</tspan></text></g><g class="term-line" style="animation-delay: 1.12s;"><text x="32" y="423" class="code-label" fill="#79c0ff">Currently: <tspan fill="#f0f6fc" font-weight="400">Building Storeasy (iOS) · LLM Decision Analytics</tspan></text></g><g class="term-line" style="animation-delay: 1.2s;"><text x="32" y="450" class="code-label" fill="#d2a8ff">Vibe: <tspan fill="#e6edf3" font-weight="400">Powered by coffee &amp; pizza ☕🍕 · &quot;a geek&quot;</tspan></text></g>

  <!-- Terminal Color Blocks -->
  <g class="term-palette" style="animation-delay: 1.36s;">
    <rect x="32" y="528" width="26" height="10" rx="2.5" fill="#0d1117" /><rect x="63" y="528" width="26" height="10" rx="2.5" fill="#ff7b72" /><rect x="94" y="528" width="26" height="10" rx="2.5" fill="#3fb950" /><rect x="125" y="528" width="26" height="10" rx="2.5" fill="#d29922" /><rect x="156" y="528" width="26" height="10" rx="2.5" fill="#58a6ff" /><rect x="187" y="528" width="26" height="10" rx="2.5" fill="#bc8cff" /><rect x="218" y="528" width="26" height="10" rx="2.5" fill="#39c5cf" /><rect x="249" y="528" width="26" height="10" rx="2.5" fill="#b1bac4" />
    <rect x="32" y="542" width="26" height="10" rx="2.5" fill="#484f58" /><rect x="63" y="542" width="26" height="10" rx="2.5" fill="#ffa198" /><rect x="94" y="542" width="26" height="10" rx="2.5" fill="#56d364" /><rect x="125" y="542" width="26" height="10" rx="2.5" fill="#e3b341" /><rect x="156" y="542" width="26" height="10" rx="2.5" fill="#79c0ff" /><rect x="187" y="542" width="26" height="10" rx="2.5" fill="#d2a8ff" /><rect x="218" y="542" width="26" height="10" rx="2.5" fill="#56d4dd" /><rect x="249" y="542" width="26" height="10" rx="2.5" fill="#f0f6fc" />
