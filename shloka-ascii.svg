<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 570" width="100%" height="100%">
  <defs>
    <style>
      @keyframes rowReveal {
        0% {
          opacity: 0;
          transform: translateY(-2px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .term-card {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.2;
        rx: 12px;
      }
      .term-topbar {
        fill: #161b22;
      }
      .term-heading {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
        font-size: 12px;
        fill: #8b949e;
        font-weight: 500;
      }
      .prompt-text {
        font-family: "SF Mono", "Fira Code", Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        fill: #58a6ff;
        font-weight: 600;
      }
      .prompt-cmd {
        fill: #7ee787;
        font-weight: 400;
      }
      .ascii-text {
        font-family: "SF Mono", "Fira Code", "Courier New", monospace;
        font-size: 9.0px;
        fill: #79c0ff;
        letter-spacing: 0px;
        white-space: pre;
      }
      .ascii-line {
        opacity: 0;
        animation: rowReveal 0.05s ease-out forwards;
      }
      .status-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
        font-size: 10.5px;
        fill: #8b949e;
      }
      .cursor-blink {
        animation: cursorBlink 1s infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="538" height="568" class="term-card" />

  <!-- Window Header -->
  <path d="M 1 13 Q 1 1 13 1 L 527 1 Q 539 1 539 13 L 539 36 L 1 36 Z" class="term-topbar" />
  <line x1="1" y1="36" x2="539" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="20" cy="19" r="5.5" fill="#ff5f56" />
  <circle cx="36" cy="19" r="5.5" fill="#ffbd2e" />
  <circle cx="52" cy="19" r="5.5" fill="#27c93f" />

  <!-- Terminal Window Title -->
  <text x="270.0" y="23" text-anchor="middle" class="term-heading">shloka@macbook-air: ~ (ascii-portrait)</text>

  <!-- Prompt Command -->
  <text x="24" y="62" class="prompt-text">shloka@github:~$ <tspan class="prompt-cmd">./render_ascii.sh --animate</tspan></text>

